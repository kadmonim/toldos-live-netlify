<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7C5CBF" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- The family's name is put into these by the Worker (worker/index.mjs) from server/lib/families.mjs. -->
  <meta name="apple-mobile-web-app-title" content="Family Tree" />
  <!-- What a shared link shows (WhatsApp, Facebook, X…). Public, so nothing personal here. -->
  <meta name="description" content="The whole family in one place: find yourself in the tree, add Hebrew birthdays, anniversaries and photos. כל המשפחה במקום אחד." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Family Tree" />
  <meta property="og:title" content="Family Tree · עץ המשפחה" />
  <meta property="og:description" content="The whole family in one place: find yourself in the tree, add Hebrew birthdays, anniversaries and photos. כל המשפחה במקום אחד." />
  <meta name="twitter:card" content="summary" />
  <title>Family Tree · עץ המשפחה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Nunito:wght@400;600;700;800&family=Rubik:wght@300;400;500;600;700;800&family=Noto+Serif+Hebrew:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* the loading screen, inline so it shows before anything else loads */
    .boot { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #EDE9FA; }
    .boot img { border-radius: 26px; box-shadow: 0 10px 30px rgba(124, 92, 191, .28); animation: boot-grow 1.8s ease-in-out infinite alternate; }
    .boot-dots { display: flex; gap: 6px; }
    .boot-dots i { width: 7px; height: 7px; border-radius: 50%; background: #7C5CBF; animation: boot-dot 1.2s ease-in-out infinite; }
    .boot-dots i:nth-child(2) { animation-delay: .2s; } .boot-dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes boot-grow { from { transform: scale(.92); opacity: .8; } to { transform: scale(1.04); opacity: 1; } }
    @keyframes boot-dot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .boot img, .boot-dots i { animation: none; } }
  </style>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- Until the app draws (it replaces this): the tree, growing gently, and three dots. -->
  <div id="app"><div class="boot" role="status" aria-label="טוען · Loading">
    <img src="/icon-192.png" alt="" width="104" height="104" />
    <span class="boot-dots"><i></i><i></i><i></i></span>
  </div></div>
  <input type="file" id="photoInput" accept="image/*" hidden />
  <dialog id="sheet"></dialog>
  <dialog id="crop"></dialog>
  <dialog id="zoom"></dialog>
  <dialog id="login"></dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
